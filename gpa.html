<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平均成绩计算器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .course-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }
        .course-row input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .course-name { flex: 2; }
        .course-score, .course-credit { flex: 1; }
        
        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            padding: 9px 15px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-add { background-color: #007bff; color: white; width: 100%; margin-top: 10px; }
        .btn-add:hover { background-color: #0056b3; }
        
        .btn-remove { background-color: #dc3545; color: white; padding: 8px 12px; }
        .btn-remove:hover { background-color: #bd2130; }
        
        .btn-calc { background-color: #28a745; color: white; width: 100%; margin-top: 15px; font-size: 16px; font-weight: bold; }
        .btn-calc:hover { background-color: #218838; }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #495057;
        }
        .result-box span { color: #007bff; font-size: 22px; }
    </style>
</head>
<body>

<div class="container">
    <h2>加权平均成绩计算器</h2>
    
    <div id="course-list">
        <div class="course-row">
            <input type="text" class="course-name" placeholder="课程名称 (选填)">
            <input type="number" class="course-score" placeholder="成绩" step="0.1" min="0" max="100">
            <input type="number" class="course-credit" placeholder="学分" step="0.5" min="0">
            <button class="btn-remove" onclick="removeRow(this)">删除</button>
        </div>
    </div>

    <button class="btn-add" onclick="addRow()">+ 添加新课程</button>
    <button class="btn-calc" onclick="calculate()">计算加权平均分</button>

    <div class="result-box" id="result-box">
        加权平均分：<span id="final-score">0.00</span>
    </div>
</div>

<script>
    function addRow() {
        const container = document.getElementById('course-list');
        const newRow = document.createElement('div');
        newRow.className = 'course-row';
        newRow.innerHTML = `
            <input type="text" class="course-name" placeholder="课程名称 (选填)">
            <input type="number" class="course-score" placeholder="成绩" step="0.1" min="0" max="100">
            <input type="number" class="course-credit" placeholder="学分" step="0.5" min="0">
            <button class="btn-remove" onclick="removeRow(this)">删除</button>
        `;
        container.appendChild(newRow);
    }

    function removeRow(btn) {
        const rows = document.getElementsByClassName('course-row');
        if (rows.length > 1) {
            btn.parentElement.remove();
        } else {
            alert('至少保留一门课程');
        }
    }

    function calculate() {
        const scores = document.getElementsByClassName('course-score');
        const credits = document.getElementsByClassName('course-credit');
        
        let totalWeightedScore = 0;
        let totalCredits = 0;

        for (let i = 0; i < scores.length; i++) {
            const score = parseFloat(scores[i].value);
            const credit = parseFloat(credits[i].value);

            if (!isNaN(score) && !isNaN(credit)) {
                if (score < 0 || credit <= 0) continue;
                totalWeightedScore += score * credit;
                totalCredits += credit;
            }
        }

        if (totalCredits === 0) {
            alert('请至少完整填写一门课程的【成绩】和【学分】！');
            return;
        }

        const average = totalWeightedScore / totalCredits;
        document.getElementById('final-score').innerText = average.toFixed(2);
    }
</script>

</body>
</html>
